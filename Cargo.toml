[package]
name = "bore-tmm"
version = "0.1.0"
edition = "2021"
authors = ["Michael Gernreich", "Claude (Anthropic) <noreply@anthropic.com>"]
description = "Transfer-matrix model of a wind instrument's bore: what a described bore plays, note by note"
license = "CC0-1.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the cut-file readers: Python's numbers and regexes, the JSON type, an SVG parser
lasermade-tools = { path = "../lasermade-tools" }
roxmltree = "0.20"

[[bin]]
name = "bore-tmm"
path = "src/main.rs"

[[bin]]
name = "read_cut_files"
path = "tools/read_cut_files.rs"

[[bin]]
name = "export_models"
path = "tools/export_models.rs"

[profile.release]
opt-level = 3
